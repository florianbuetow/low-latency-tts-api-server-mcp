[project]
name = "low-latency-tts-service-mcp"
version = "0.0.1"
description = "A Python CLI application"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "en-core-web-sm>=3.8.0",
    "fastapi>=0.115.0",
    "misaki>=0.9.4",
    "num2words>=0.5.14",
    "numpy>=1.26.0",
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "sounddevice>=0.4.6",
    "spacy>=3.8.0",
    "uvicorn>=0.34.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/low_latency_tts_service_mcp"]

[project.optional-dependencies]
dev = [
    # Testing
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-randomly>=3.15.0",
    "pytest-timeout>=2.2.0",
    "httpx>=0.27.0",

    # Linting & Formatting
    "ruff>=0.1.0",

    # Type Checking
    "mypy>=1.7.0",
    "pyright>=1.1.0",

    # Architecture
    "pytestarch>=4.0.0",

    # Security & Quality
    "bandit[toml]>=1.7.8",
    "deptry>=0.20.0",
    "pygount>=1.6.4",
    "codespell>=2.3.0",
    "pip-audit>=2.7.0",
    "semgrep>=1.144.0",

    # Git Hooks
    "pre-commit>=3.6.0",
    "types-PyYAML>=6.0.12",
]

[tool.ruff]
line-length = 140
indent-width = 4
target-version = "py312"
exclude = [".git", ".ruff_cache", ".venv", ".vscode", "reports"]

[tool.ruff.lint]
# Core errors & warnings, Google-style docs, types, bugbear, quotes, imports, naming
# Plus: complexity, modern syntax, performance, simplifications, tidy imports
select = [
  "E", "F",   # pycodestyle errors, pyflakes
  "D",        # pydocstyle (Google-style)
  "ANN",      # flake8-annotations
  "B",        # flake8-bugbear
  "Q",        # flake8-quotes
  "I",        # isort
  "N",        # pep8-naming
  "C90",      # mccabe complexity
  "UP",       # pyupgrade (modern Python 3.12+ syntax)
  "PERF",     # perflint (performance anti-patterns)
  "SIM",      # flake8-simplify
  "TID",      # flake8-tidy-imports
]
ignore = [
  "D107",    # don't require __init__ docstring (class docstring is fine)
  "N802",    # allow non-lowercase function names (if needed)
]

[tool.ruff.lint.mccabe]
# Flag functions with complexity > 10
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
# Ban relative imports for cleaner, more explicit code
ban-relative-imports = "all"

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D", "ANN"]
"stubs/**/*.pyi" = ["D", "ANN"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
# pytest-timeout: prevent tests from hanging indefinitely
timeout = 30
timeout_method = "thread"
# pytest-randomly: randomize test order to catch hidden dependencies
markers = [
    "architecture: Architecture import rule tests",
]

[tool.mypy]
python_version = "3.12"
mypy_path = "stubs"
strict = true
warn_unused_configs = true
no_implicit_reexport = true
disable_error_code = ["import-untyped"]

# Limit what mypy considers part of the project
files = ["src"]

# CI ergonomics
show_error_codes = true
pretty = true

# Exclude virtual environment
exclude = [".venv/"]

# Third-party libraries without complete type stubs
[[tool.mypy.overrides]]
module = [
    "sounddevice",
    "uvicorn",
]
ignore_missing_imports = true

[tool.coverage.run]
source = ["src"]
omit = [
    "*/tests/*",
    "*/test_*.py",
    "*/__init__.py",
]
branch = true

[tool.coverage.report]
precision = 2
show_missing = true
skip_covered = false
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "@abstractmethod",
    "@abc.abstractmethod",
]

[tool.coverage.html]
directory = "reports/coverage/html"

[tool.coverage.xml]
output = "reports/coverage/coverage.xml"

[tool.bandit]
targets = ["src"]
exclude = [
    "tests",
    ".venv",
    "venv",
]
# Reasonable default for CI
severity = "MEDIUM"
confidence = "MEDIUM"

[tool.deptry]
# Source scanning - only check src/ directory
extend_exclude = [
    "build",
    "dist",
    "docs",
    "scripts",
    "data",
    "reports",
    "notes",
]

# Ignore Jupyter notebooks (not part of production code)
ignore_notebooks = true

# First-party modules - tell deptry what belongs to this project
known_first_party = [
    "low_latency_tts_service_mcp",
]

# PEP 621 dev dependency groups - these are NOT runtime dependencies
pep621_dev_dependency_groups = [
    "dev",
]

# Keep all rules enabled (DEP001-DEP005)
ignore = []

# CI/Reporting integration
json_output = "reports/deptry/deptry.json"

[tool.deptry.per_rule_ignores]
DEP002 = [
    "pytestarch",  # Used in tests/architecture/ only
    "uvicorn",  # Used as CLI server runner.
    # Runtime requirements of misaki.en. misaki only declares them behind its [en]
    # extra, which also pulls torch and espeak; they are listed directly instead.
    "en-core-web-sm",
    "num2words",
    "spacy",
]

[tool.codespell]
# Paths to check
check-filenames = true
check-hidden = false

# Directories to skip
skip = ".git,.venv,venv,build,dist,reports,*.lock,uv.lock"

# Use external ignore file for maintainability
ignore-words = "config/codespell/ignore.txt"

[tool.uv.sources]
# spaCy models are not on PyPI; misaki loads this one for tokenization.
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }

[tool.uv]
# Supply-chain protection: ignore packages published in the last 7 days,
# giving the community time to detect and yank malicious releases.
# Reduced from 30 days to allow security patches through.
exclude-newer = "7 days"

# Security floors for transitive dependencies that resolve to versions with
# known advisories, keeping code-audit (pip-audit) green. Each floor is the
# lowest patched release named by the advisory; uv selects the newest direct
# dependency compatible with the floor and advances automatically once the
# upstream pins relax.
constraint-dependencies = [
    "pyjwt>=2.13.0",      # semgrep[crypto] pins a vulnerable 2.12.x
    "anyio>=4.14.2",      # GHSA-82r6-8w77-94w6, GHSA-5p39-cfhj-2xmp
    "click>=8.3.3",       # PYSEC-2026-2132
    "cryptography>=50.0.0",  # PYSEC-2026-3552
    "gitpython>=3.1.60",  # PYSEC-2026-3984, PYSEC-2026-3982 and others
    "mcp>=1.28.1",        # PYSEC-2026-3481, PYSEC-2026-3482, PYSEC-2026-3483
    "pip>=26.2",          # PYSEC-2026-3721
]
